# 版本更新交給 Dependabot:GitHub Actions 都鎖在 commit(zizmor 要求),新版出來它開 PR 換;
# pyproject.toml 的套件版本固定,一樣由它開 PR 升。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # 新版出來先等 7 天再升:剛發佈就被植入惡意程式的版本,通常幾天內會被抓到撤下
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # 新版出來先等 7 天再升:剛發佈就被植入惡意程式的版本,通常幾天內會被抓到撤下
