# jobsalvo 用到的第三方套件只列在這裡。用 uv 管(https://docs.astral.sh/uv/concepts/projects/):
# uv sync 照這份和 uv.lock 在 repo 的 .venv 建環境,程式都用 .venv 的 python 跑。安裝、更新、CI 都是 uv sync。
[project]
name = "jobsalvo"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "Markdown==3.11",          # 履歷 Markdown 轉 PDF
    "pypdf==6.19.0",             # 讀 PDF 頁數、比對頁面
]

[tool.uv]
package = false   # 這是應用程式,不是要發佈的套件
exclude-newer = "7 days"   # 新版先等 7 天再用(https://docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns),跟 Dependabot 一致

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# 不准默默失敗(#301):抓所有例外(BLE001)、吞錯(S110、S112、SIM105)、光禿禿的 except(E722)。
# 每一處三選一:只抓預期的那種;影響他資料或結果的讓他看得到(看板回報、狀態訊息);真的無害的在同一行
# `# noqa: <規則> — <理由>`(tests/test_no_silent_failures.py 檢查理由有寫)。
# 另外:沒用到的 import / 變數(F401、F841)、用到沒定義的名字(F821)
select = ["BLE001", "S110", "S112", "SIM105", "E722", "F401", "F821", "F823", "F841"]

[dependency-groups]
dev = [
    "playwright==1.63.0",        # 開發用:CI 的 Linux 沒有 ego,看板檢查、截圖、副本 PDF 在那裡用它開 Chrome(dev_browser、dev_pdf);本機跟使用者的功能一樣走 ego
    "coverage==7.16.2",          # 測試的分岔覆蓋率:哪些 if/except 的路從來沒被測到(CI 單元測試那一步)
    "hypothesis==6.170.13",      # 測試用:隨機產生假網站,考程式列的改動清單等於測試台看到的改前改後差異(ADR-0011)
    "mutmut==3.8.1",             # 突變測試:改掉程式一處看測試抓不抓得到(四件網站任務與共用核心,x99 手動跑)
]

# 本機跟 CI 同一組指令:
#   uv run coverage run -m unittest discover -s tests && uv run coverage combine && uv run coverage report
# 只算 tools/(測試本身不算);branch:每個 if / except 兩條路各自算有沒有走到,沒走到的列成「行->行」。
# 測試常用子程序跑 tools/ 的指令(例如 board_doc.py --trust):patch = subprocess 讓那些也算進來,
# 不然明明測過的路會被列成沒測到。每個程序各寫一份,要 combine 併起來才出報告
[tool.coverage.run]
branch = true
source = ["tools"]
patch = ["subprocess"]
disable_warnings = ["no-data-collected"]   # 測試也會起不是 tools/ 的子程序(python -c …):那些本來就不算,別在 stderr 喊

[tool.coverage.report]
show_missing = true
skip_covered = true
# 直接執行指令才會走的那一行(if __name__ == '__main__':)不算:入口本身在 main() 裡,有測就是測 main()
exclude_also = ["if __name__ == .__main__.:"]

# 突變測試(x99 手動跑):先 `ln -s tools src`(測試照 `import sync` 載入,mutmut 只把 src/ 底下的檔名當成模組名),
# 再 `chrt --idle 0 uv run mutmut run --max-children 4`。只改四件網站任務與共用核心,只跑從任務入口考行為的驗收測試;
# 活下來的突變:使用者看不出差別就刪程式,看得出就從入口補斷言
[tool.mutmut]
source_paths = ["src"]
only_mutate = ["*src/sync.py", "*src/fill.py", "*src/progress.py", "*src/find.py", "*src/add_job.py",
               "*src/page_fetch.py", "*src/form_plan.py", "*src/web/*.py"]
also_copy = ["tests", "defaults", "examples", "board", "docs"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
pytest_add_cli_args_test_selection = ["tests/test_accept_sync.py", "tests/test_accept_fill.py",
                                      "tests/test_accept_progress.py", "tests/test_accept_find.py",
                                      "tests/test_fake_browser.py"]
