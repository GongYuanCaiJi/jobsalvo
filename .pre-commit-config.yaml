# commit 前只做幾秒就跑完的檢查;完整測試與看板規矩檢查交給 CI(.github/workflows/ci.yml)。
# 裝:pre-commit install(clone 之後一次)。能用現成工具的一律用現成的,只有產品自己的規矩才寫在 tools/。
repos:
  - repo: local
    hooks:
      # 私人字串(真名、公司、本機路徑):字詞清單只放本機 .git/info/private-words,不進版控
      - id: privacy-scan
        name: 私人字串
        entry: python3 tools/privacy_scan.py
        language: system
        pass_filenames: false
  # 模組歸屬:卡片編號、名字清理、找可投遞夾各自只准在一支程式裡做(規則與測試在 .semgrep/,semgrep --test .semgrep/)
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.178.0
    hooks:
      - id: semgrep
        # 暫時:semgrep 把堆疊軟上限設成「硬上限 ÷ 3」,Python 3.15 起無上限是 2⁶⁴−1,算出約 6EB,semgrep-core 一啟動就當掉
        # (semgrep/semgrep#11979,修正送在 semgrep/semgrep#11987)。先把硬上限設成 3GB,它就算回原本的 1GB;
        # 硬上限本來就有限的機器(Mac)改不上去,照原樣跑。
        # 另外 CI pod 的鎖定記憶體只有 8MB,pre-commit 同時開多個 semgrep 時 io_uring 拿不到記憶體、新開的執行緒沒有退路就當掉
        # (semgrep/semgrep#11802),EIO_BACKEND=posix 改用一般 I/O。上游修好、發版後拿掉這個 entry(jobsalvo-dev#459)
        entry: bash -c 'ulimit -Hs 3000000 2>/dev/null; EIO_BACKEND=posix exec semgrep "$@"' --
        args: [--config, .semgrep/module-ownership.yml, --error, --metrics=off, --disable-version-check, --quiet]
        exclude: ^\.semgrep/
  # API 金鑰、密碼、權杖(認得幾百種長相;私人字串掃描只認得清單上的字,兩個不能互換)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  # 不准默默失敗(抓所有例外、吞錯)、沒用到的 import 和變數。規則在 pyproject.toml;真的無害的在那行寫 # noqa: <規則> — <理由>
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
  # GitHub Actions 設定檔:語法、shell 寫法(actionlint);危險寫法、權限太寬(zizmor)
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--config, .github/zizmor.yml]   # 範本的設定:自己的共用 CI 跟 main 走,其他 action 鎖 commit
